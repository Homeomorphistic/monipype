[project]
name = "monipype"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Homeomorphistic", email = "chmiela.bartosz@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
monipype = "monipype:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mutmut>=3.8.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "ty>=0.0.69",
    "xenon>=0.9.3",
]

[tool.pytest]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true

[tool.coverage.run]
source = ["monipype"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
