[project]
name = "monipype"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Homeomorphistic", email = "chmiela.bartosz@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
monipype = "monipype:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
