name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: 3.14
      - name: Run tests
        run: uv run --frozen pytest --cov -q
      - name: Enforce coverage
        run: uv run --frozen coverage report --fail-under=90

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: uv.lock
          args: check
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: uv.lock
          args: format --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: 3.14
      - name: Type check
        run: uv run --frozen ty check

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: 3.14
      - name: Check code complexity
        run: uv run --frozen xenon --max-absolute=B --max-modules=B --max-average=A .
      - uses: kucherenko/jscpd@v5
        with:
          config: .jscpd.json
          threshold: 3
          upload-sarif: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Scan for secrets
        run: |
          go install github.com/betterleaks/betterleaks@v1.8.1
          betterleaks git .

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: 3.14
      - name: Mutation tests
        run: uv run --frozen mutmut run